<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empan visuo-attentionnel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}body{height:100%;font-family:'Nunito',system-ui,sans-serif;background:#fff;color:#111;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── HEADER ── */
#header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#fff;border-bottom:1px solid #e8e8e8;flex-shrink:0}
#header h1{font-size:17px;font-weight:800;letter-spacing:.5px;color:#111}
#score-badge{background:linear-gradient(135deg,#5AABB0,#3D8F95);color:#fff;font-weight:900;font-size:15px;padding:5px 16px;border-radius:20px}
#level-badge{background:#f0f0f0;color:#555;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px}

/* ── CONFIG PANEL ── */
#config{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;padding:0;background:#fff;overflow-y:scroll;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* Hero */
#hero{width:100%;padding:24px 0 8px;display:flex;justify-content:center;flex-shrink:0;background:#fff}
#hero-logo{width:220px;height:220px;object-fit:contain;background:transparent}
#hero-text{display:none}

/* Params card */
#params-card{width:100%;max-width:520px;padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px;margin:0 auto}

.param-block{display:flex;flex-direction:column;gap:8px}
.param-label{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.8px}
.toggle-group{display:flex;gap:6px;flex-wrap:wrap}
.tog{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid #ddd;background:#f5f5f5;color:#555;transition:all .15s;white-space:nowrap}
.tog:hover{border-color:#bbb;background:#eee}
.tog.active{border-color:#5AABB0;background:#5AABB0;color:#fff}
.tog.digit-tog{font-family:monospace;letter-spacing:1px}
input[type=range]{width:100%;accent-color:#5AABB0;height:6px}
.rng-val{font-size:14px;font-weight:800;color:#3D8F95;display:inline}
#start-btn{background:linear-gradient(135deg,#5AABB0,#3D8F95);color:#fff;font-size:18px;font-weight:900;padding:14px 48px;border:none;border-radius:14px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 20px rgba(90,171,176,.35);transition:transform .1s;align-self:center;margin-top:4px}
#start-btn:hover{transform:scale(1.03)}
#start-btn:active{transform:scale(0.97)}

/* ── GAME SCREEN ── */
#game{flex:1;display:none;flex-direction:column;position:relative}

/* DISPLAY ZONE */
#display-zone{flex:1;position:relative;overflow:hidden;background:#fff;border-bottom:1px solid #e8e8e8}
.letter-token{position:absolute;font-size:24px;font-weight:700;color:#111;transform:translate(-50%,-50%);transition:opacity .15s;user-select:none;letter-spacing:1px;white-space:nowrap}
.letter-token.highlight{color:#111;font-weight:900}
.letter-token.img-mode{font-size:32px;letter-spacing:4px}

/* FLASH overlay */
#flash{position:absolute;inset:0;background:#5AABB0;opacity:0;pointer-events:none;transition:opacity .1s}

/* STATUS BAR */
#status-bar{padding:10px 20px;background:#f5f5f5;border-top:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:12px;min-height:44px}
#status-msg{font-size:15px;font-weight:700;flex:1;color:#333}
#status-msg.ok{color:#16a34a}
#status-msg.err{color:#dc2626}
#status-msg.info{color:#888}
#attempt-dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#ddd}
.dot.filled{background:#f0a500}

/* RESPONSE ZONE */
#response-zone{padding:12px 16px 8px;background:#fff;border-top:1px solid #e8e8e8}
#typed-display{display:flex;gap:8px;justify-content:center;min-height:52px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.typed-char{width:42px;height:48px;border-radius:10px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;background:#f9f9f9;color:#111;transition:all .15s}
.typed-char.filled{border-color:#5AABB0;background:#eaf6f7;color:#111}
.typed-char.correct{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
.typed-char.wrong{border-color:#dc2626;background:#fef2f2;color:#dc2626;animation:shake .3s}
.typed-char.cursor{border-color:#f0a500;background:#fffbeb}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* VIRTUAL KEYBOARD */
#vkb{display:grid;gap:5px;padding:0 4px 6px}
.vkb-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.vk{width:40px;height:40px;border-radius:8px;border:1.5px solid #ddd;background:#f5f5f5;color:#111;font-size:17px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .12s;display:flex;align-items:center;justify-content:center}
.vk:hover{background:#ebebeb;border-color:#ccc}
.vk:active,.vk.pressed{background:#5AABB0;border-color:#5AABB0;color:#fff;transform:scale(0.93)}
.vk.del-key{width:58px;font-size:13px;color:#b45309;border-color:#fde68a;background:#fffbeb}
.vk.val-key{width:70px;font-size:13px;font-weight:900;background:#16a34a;border-color:#16a34a;color:#fff}
.vk.val-key:hover{background:#15803d}
.vk.img-key{width:52px;height:52px;font-size:26px;border-radius:12px;border-color:#bbb}

/* POINTS POPUP */
.pts-popup{position:absolute;font-size:28px;font-weight:900;color:#d97b00;pointer-events:none;animation:floatUp .9s ease-out forwards;z-index:100}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}

/* COUNTDOWN */
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);z-index:50;font-size:90px;font-weight:900;color:#5AABB0;transition:opacity .3s}

/* NEXT BTN */
#next-btn{display:none;margin:6px auto 0;background:#16a34a;color:#fff;font-size:15px;font-weight:900;padding:9px 32px;border:none;border-radius:12px;cursor:pointer;font-family:'Nunito',sans-serif}
#next-btn:hover{background:#15803d}

/* HOME BTN */
#home-btn{background:transparent;border:1.5px solid #ddd;color:#888;font-size:18px;padding:4px 10px;border-radius:8px;cursor:pointer;line-height:1;display:none}
#home-btn:hover{border-color:#999;color:#555}
#test-counter{font-size:13px;font-weight:700;color:#888;white-space:nowrap}

/* ── DEVICE SCREEN ── */
#device-screen{
  position:fixed;inset:0;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;z-index:200;padding:24px;
}
#device-screen img{width:140px;height:140px;object-fit:contain}
#device-screen h2{font-size:22px;font-weight:900;color:#111;text-align:center;line-height:1.3}
#device-screen p{font-size:14px;color:#888;text-align:center}
.device-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.device-btn{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:18px 22px;border-radius:16px;border:2px solid #e0e0e0;
  background:#f9f9f9;cursor:pointer;font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:800;color:#555;transition:all .15s;min-width:100px;
}
.device-btn span.icon{font-size:36px}
.device-btn:hover{border-color:#5AABB0;background:#EBF7F8;color:#3D8F95}
.device-btn.selected{border-color:#5AABB0;background:#5AABB0;color:#fff}

/* ── DEVICE: smartphone ── */
body.device-phone #hero-logo{width:80px;height:80px}
body.device-phone #hero{padding:12px 0 4px}
body.device-phone #header h1{font-size:14px}
body.device-phone #header{padding:7px 12px}
body.device-phone .param-label{font-size:11px}
body.device-phone #params-card{padding:12px 14px 18px;gap:12px}
body.device-phone .tog{padding:6px 12px;font-size:12px}
body.device-phone #start-btn{font-size:16px;padding:12px 36px}
body.device-phone .vk{width:30px;height:34px;font-size:14px}
body.device-phone .vk.del-key{width:42px;font-size:11px}
body.device-phone .vk.val-key{width:54px;font-size:12px}
body.device-phone .vk.img-key{width:42px;height:42px;font-size:22px}
body.device-phone .letter-token{font-size:18px}
body.device-phone .letter-token.img-mode{font-size:26px}
body.device-phone .typed-char{width:34px;height:40px;font-size:20px}
body.device-phone #countdown{font-size:70px}

/* ── DEVICE: tablette ── */
body.device-tablet #hero-logo{width:160px;height:160px}
body.device-tablet #params-card{padding:16px 18px 22px;gap:14px}
body.device-tablet .tog{padding:7px 14px;font-size:13px}
body.device-tablet .vk{width:44px;height:44px;font-size:18px}
body.device-tablet .vk.del-key{width:62px;font-size:13px}
body.device-tablet .vk.val-key{width:76px;font-size:14px}
body.device-tablet .vk.img-key{width:56px;height:56px;font-size:28px}
body.device-tablet .letter-token{font-size:28px}
body.device-tablet .letter-token.img-mode{font-size:38px}
body.device-tablet .typed-char{width:48px;height:54px;font-size:30px}
body.device-tablet #countdown{font-size:110px}

/* ── DEVICE: ordinateur (défaut, déjà dimensionné) ── */

@media(max-width:500px){
  .vk{width:32px;height:36px;font-size:15px}
  .vk.del-key{width:46px;font-size:12px}
  .vk.val-key{width:58px;font-size:12px}
  .letter-token{font-size:20px}
}
</style>
</head>

<div id="device-screen">

    <div id="flash"></div>
    <div id="countdown" style="display:none"></div>
  </div>

    <span id="status-msg" class="info">Prêt…</span>
    <div id="attempt-dots"></div>
    <button id="next-btn" onclick="nextRound()">Suivant ▶</button>
  </div>
  <div id="response-zone">
    <div id="typed-display"></div>
    <div id="vkb"></div>
  </div>

</div>

<script>
let stimType='lowercase';
let stimPos='center';
let nb=4, dur=800, maxTests=10;
let score=0, level=1, roundsWon=0, testsDone=0;
let target=[], typed=[], attempts=0, maxAttempts=3;
let phase='idle';

const LOWERCASE='bdbdpqpqmnmnvfbdpqmn'.split('').concat('aehiklnorusvwxyz'.split(''));
const UPPERCASE='BBDDPPQQMMNNVFBDPQMN'.split('').concat('AEHIKLNORUSVWXYZ'.split(''));
const DIGITS='0123456789'.split('');
// 10 emoji bien contrastés visuellement (couleurs et formes variées, pas de proches voisins)
const IMAGES=['🐱','🚗','🍎','⭐','🐸','🦁','🌂','🍕','🎈','🐠'];

function pickChars(n){
  let pool;
  if(stimType==='lowercase') pool=LOWERCASE;
  else if(stimType==='uppercase') pool=UPPERCASE;
  else if(stimType==='images') pool=IMAGES;
  else pool=DIGITS;
  const res=[];
  for(let i=0;i<n;i++) res.push(pool[Math.floor(Math.random()*pool.length)]);
  return res;
}

function setType(btn){
  // Désactiver seulement les boutons de type (pas pos-tog)
  document.querySelectorAll('.tog:not(.pos-tog)').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  stimType=btn.dataset.type;
}
function setPos(btn){
  document.querySelectorAll('.pos-tog').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  stimPos=btn.dataset.pos;
}
function updateRng(id){
  document.getElementById(id+'-val').textContent=document.getElementById(id).value;
}

function startGame(){
  // Lire directement les valeurs HTML (évite tout bug de sync)
  nb=parseInt(document.getElementById('nb').value)||4;
  dur=parseInt(document.getElementById('dur').value)||800;
  maxTests=parseInt(document.getElementById('maxt').value)||10;
  // Relire le type actif au cas où l'état JS serait désynchronisé
  const activeType=document.querySelector('.tog.active:not(.pos-tog)');
  if(activeType) stimType=activeType.dataset.type;
  const activePos=document.querySelector('.pos-tog.active');
  if(activePos) stimPos=activePos.dataset.pos;
  score=0; level=1; roundsWon=0; testsDone=0;
  updateHeader();
  document.getElementById('home-btn').style.display='block';
  document.getElementById('config').style.display='none';
  document.getElementById('game').style.display='flex';
  buildVKB();
  nextRound();
}

function goHome(){
  document.getElementById('home-btn').style.display='none';
  document.getElementById('game').style.display='none';
  document.getElementById('config').style.display='flex';
  document.getElementById('test-counter').textContent='';
  phase='idle';
}

function updateHeader(){
  document.getElementById('score-badge').textContent='⭐ '+score;
  document.getElementById('level-badge').textContent='Niveau '+level;
  document.getElementById('test-counter').textContent=testsDone+'/'+maxTests;
}

function nextRound(){
  if(testsDone>=maxTests){
    setStatus('🎉 Séance terminée ! Score final : '+score+' pts','ok');
    document.getElementById('next-btn').style.display='none';
    phase='idle';
    return;
  }
  testsDone++;
  updateHeader();
  document.getElementById('next-btn').style.display='none';
  typed=[];
  attempts=0;
  target=pickChars(nb);
  updateAttemptDots();
  setStatus('','info');
  showCountdown(()=>showStimuli());
}

function showCountdown(cb){
  phase='showing';
  const el=document.getElementById('countdown');
  el.style.display='flex';
  let c=3;
  el.textContent=c;
  const iv=setInterval(()=>{
    c--;
    if(c>0){el.textContent=c;}
    else{clearInterval(iv);el.style.display='none';cb();}
  },700);
}

function getPos(zone){
  const W=zone.clientWidth, H=zone.clientHeight;
  if(stimPos==='center') return {x:W/2, y:H/2};
  const marginX=100, marginY=60;
  return {x:marginX+Math.random()*(W-2*marginX), y:marginY+Math.random()*(H-2*marginY)};
}

function showStimuli(){
  const zone=document.getElementById('display-zone');
  zone.querySelectorAll('.letter-token').forEach(e=>e.remove());
  const {x,y}=getPos(zone);
  const el=document.createElement('div');
  el.className='letter-token'+(stimType==='images'?' img-mode':'');
  el.textContent=target.join('');
  el.style.left=x+'px';
  el.style.top=y+'px';
  zone.appendChild(el);
  const flash=document.getElementById('flash');
  flash.style.opacity='0.08';
  setTimeout(()=>flash.style.opacity='0',120);
  setTimeout(()=>{
    zone.querySelectorAll('.letter-token').forEach(e=>e.remove());
    phase='input';
    typed=[];
    renderTyped();
    const msg=stimType==='digits'?'Tape les chiffres dans l\'ordre !':stimType==='images'?'Tape les images dans l\'ordre !':'Tape les lettres dans l\'ordre !';
    setStatus(msg,'info');
    enableInput(true);
  }, dur);
}

let inputEnabled=false;
function enableInput(v){inputEnabled=v;}

function handleChar(ch){
  if(!inputEnabled||phase!=='input') return;
  if(typed.length>=nb) return;
  typed.push(ch);
  renderTyped();
  flashVK(ch);
}

function handleDel(){
  if(!inputEnabled||phase!=='input') return;
  if(typed.length>0){typed.pop();renderTyped();}
}

function handleValidate(){
  if(!inputEnabled||phase!=='input') return;
  if(typed.length!==nb){
    const unit=stimType==='digits'?'chiffre(s)':stimType==='images'?'image(s)':'lettre(s)';
    setStatus('Tape encore '+(nb-typed.length)+' '+unit+' !','err');
    return;
  }
  checkAnswer();
}

document.addEventListener('keydown', e=>{
  const k=e.key;
  // Entrée = Suivant si le bouton est visible
  if(k==='Enter' && phase==='idle'){
    const nb=document.getElementById('next-btn');
    if(nb && nb.style.display!=='none'){nextRound();return;}
  }
  if(phase!=='input') return;
  if(k==='Backspace' && stimType!=='images'){handleDel();return;}
  if(k==='Enter'){handleValidate();return;}
  if(stimType==='images') return; // images: virtual keyboard only
  if(stimType==='uppercase'){
    const ch=k.toUpperCase();
    if(/^[A-Z]$/.test(ch)) handleChar(ch);
  } else if(stimType==='lowercase'){
    const ch=k.toLowerCase();
    if(/^[a-z]$/.test(ch)) handleChar(ch);
  } else {
    if(/^[0-9]$/.test(k)) handleChar(k);
  }
});

function checkAnswer(){
  enableInput(false);
  phase='feedback';
  const correct=typed.join('')===target.join('');
  renderTypedFeedback(correct);
  if(correct){
    const pts=pointsForRound();
    score+=pts;
    roundsWon++;
    showPtsPopup(pts);
    setStatus('✓ Bravo ! +'+pts+' points','ok');
    updateHeader();
    checkLevelUp();
    setTimeout(()=>{document.getElementById('next-btn').style.display='block';phase='idle';},900);
  } else {
    attempts++;
    updateAttemptDots();
    if(attempts>=maxAttempts){
      setStatus('La bonne réponse était : '+target.join(' '),'err');
      setTimeout(()=>{reshowTarget(()=>{document.getElementById('next-btn').style.display='block';phase='idle';});},1000);
    } else {
      setStatus('Pas tout à fait… regarde encore !','err');
      setTimeout(()=>{reshowTarget(()=>{typed=[];renderTyped();setStatus('Réessaie !','info');phase='input';enableInput(true);});},800);
    }
  }
}

function reshowTarget(cb){
  const zone=document.getElementById('display-zone');
  zone.querySelectorAll('.letter-token').forEach(e=>e.remove());
  const {x,y}=getPos(zone);
  const el=document.createElement('div');
  el.className='letter-token highlight'+(stimType==='images'?' img-mode':'');
  el.textContent=target.join('');
  el.style.left=x+'px';
  el.style.top=y+'px';
  zone.appendChild(el);
  setTimeout(()=>{zone.querySelectorAll('.letter-token').forEach(e=>e.remove());cb();}, dur);
}

function pointsForRound(){
  const attBonus=[3,2,1];
  const base=nb;
  const spd=Math.round(10-dur/200);
  return Math.max(1,(base+spd)*attBonus[Math.min(attempts,2)]);
}

function checkLevelUp(){
  if(roundsWon>0&&roundsWon%5===0){level++;updateHeader();setStatus('🎉 Niveau '+level+' ! Super !','ok');}
}

function renderTyped(){
  const d=document.getElementById('typed-display');
  d.innerHTML='';
  for(let i=0;i<nb;i++){
    const el=document.createElement('div');
    el.className='typed-char'+(i===typed.length?' cursor':'');
    if(i<typed.length){el.textContent=typed[i];el.classList.add('filled');}
    d.appendChild(el);
  }
}

function renderTypedFeedback(correct){
  const chars=document.getElementById('typed-display').querySelectorAll('.typed-char');
  chars.forEach((el,i)=>{
    if(i<typed.length){el.classList.remove('filled','cursor');el.classList.add(correct?'correct':'wrong');}
  });
}

function updateAttemptDots(){
  const d=document.getElementById('attempt-dots');
  d.innerHTML='';
  for(let i=0;i<maxAttempts;i++){
    const dot=document.createElement('div');
    dot.className='dot'+(i<attempts?' filled':'');
    d.appendChild(dot);
  }
}

function setStatus(msg,cls){
  const el=document.getElementById('status-msg');
  el.textContent=msg;
  el.className=cls;
}

function showPtsPopup(pts){
  const zone=document.getElementById('display-zone');
  const el=document.createElement('div');
  el.className='pts-popup';
  el.textContent='+'+pts;
  el.style.left=Math.random()*60+20+'%';
  el.style.top=Math.random()*40+20+'%';
  zone.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function buildVKB(){
  const vkb=document.getElementById('vkb');
  vkb.innerHTML='';
  if(stimType==='lowercase'){
    const rows=['a b c d e f g h i j'.split(' '),'k l m n o p q r s t'.split(' '),'u v w x y z'.split(' ')];
    rows.forEach((row,ri)=>{
      const rowEl=document.createElement('div');
      rowEl.className='vkb-row';
      row.forEach(ch=>{
        const btn=document.createElement('button');
        btn.className='vk';btn.textContent=ch;btn.dataset.ch=ch;
        btn.onclick=()=>handleChar(ch);
        rowEl.appendChild(btn);
      });
      if(ri===rows.length-1){
        const del=document.createElement('button');
        del.className='vk del-key';del.textContent='⌫ Eff';del.onclick=handleDel;
        rowEl.appendChild(del);
        const val=document.createElement('button');
        val.className='vk val-key';val.textContent='✓ OK';val.onclick=handleValidate;
        rowEl.appendChild(val);
      }
      vkb.appendChild(rowEl);
    });
  } else if(stimType==='uppercase'){
    const rows=['A B C D E F G H I J'.split(' '),'K L M N O P Q R S T'.split(' '),'U V W X Y Z'.split(' ')];
    rows.forEach((row,ri)=>{
      const rowEl=document.createElement('div');
      rowEl.className='vkb-row';
      row.forEach(ch=>{
        const btn=document.createElement('button');
        btn.className='vk';btn.textContent=ch;btn.dataset.ch=ch;
        btn.onclick=()=>handleChar(ch);
        rowEl.appendChild(btn);
      });
      if(ri===rows.length-1){
        const del=document.createElement('button');
        del.className='vk del-key';del.textContent='⌫ Eff';del.onclick=handleDel;
        rowEl.appendChild(del);
        const val=document.createElement('button');
        val.className='vk val-key';val.textContent='✓ OK';val.onclick=handleValidate;
        rowEl.appendChild(val);
      }
      vkb.appendChild(rowEl);
    });
  } else if(stimType==='digits'){
    const rowEl=document.createElement('div');
    rowEl.className='vkb-row';
    for(let i=0;i<=9;i++){
      const btn=document.createElement('button');
      btn.className='vk';btn.textContent=String(i);
      btn.onclick=()=>handleChar(String(i));
      rowEl.appendChild(btn);
    }
    const del=document.createElement('button');
    del.className='vk del-key';del.textContent='⌫';del.onclick=handleDel;rowEl.appendChild(del);
    const val=document.createElement('button');
    val.className='vk val-key';val.textContent='✓ OK';val.onclick=handleValidate;rowEl.appendChild(val);
    vkb.appendChild(rowEl);
  } else if(stimType==='images'){
    // 2 lignes de 5 emoji bien espacés
    [IMAGES.slice(0,5), IMAGES.slice(5,10)].forEach((row, ri)=>{
      const rowEl=document.createElement('div');
      rowEl.className='vkb-row';
      rowEl.style.gap='10px';
      row.forEach(em=>{
        const btn=document.createElement('button');
        btn.className='vk img-key';btn.textContent=em;btn.dataset.ch=em;
        btn.onclick=()=>handleChar(em);
        rowEl.appendChild(btn);
      });
      if(ri===1){
        const del=document.createElement('button');
        del.className='vk del-key';del.textContent='⌫';del.onclick=handleDel;rowEl.appendChild(del);
        const val=document.createElement('button');
        val.className='vk val-key';val.textContent='✓ OK';val.onclick=handleValidate;rowEl.appendChild(val);
      }
      vkb.appendChild(rowEl);
    });
  }
}

function flashVK(ch){
  const btn=document.querySelector('.vk[data-ch="'+ch+'"]');
  if(!btn)return;
  btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'),150);
}

function chooseDevice(dev){
  document.getElementById('device-screen').style.display='none';
  // Remove any previous device class
  document.body.classList.remove('device-desktop','device-tablet','device-phone');
  if(dev==='phone') document.body.classList.add('device-phone');
  else if(dev==='tablet') document.body.classList.add('device-tablet');
  else document.body.classList.add('device-desktop');
  // Remember choice for this session
  try{sessionStorage.setItem('evaDevice',dev);}catch(e){}
}

// Auto-detect device on load, but still show choice screen
(function(){
  // Copy logo src to device screen
  const logo = document.getElementById('hero-logo');
  const dsLogo = document.getElementById('ds-logo');
  if(logo && dsLogo) dsLogo.src = logo.src;
  // If device was already chosen this session, skip screen
  try{
    const saved=sessionStorage.getItem('evaDevice');
    if(saved){chooseDevice(saved);return;}
  }catch(e){}
  // Show device screen
  document.getElementById('device-screen').style.display='flex';
})();

updateRng('nb');updateRng('dur');
</script>
